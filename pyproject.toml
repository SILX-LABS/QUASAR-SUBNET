[project]
name = "quasar"
version = "0.8.0"
description = "Quasar SN24 - Bittensor subnet built to crush the long-context barrier"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "boto3",
    "bittensor",
    "bittensor-wallet",
    "click",
    "datasets",
    "fastapi",
    "huggingface-hub",
    "httpx",
    "lium.io",
    "numpy",
    "pydantic",
    "requests",
    "rich",
    "safetensors",
    "starlette",
    "torch",
    "transformers",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
gpu = [
    "flash-attn",
]

[tool.setuptools.packages.find]
include = ["eval*", "api*"]
exclude = ["state*", "scripts*", "neurons*"]
