<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quasar — SN24 Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
@font-face {
    font-family: "Inter";
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url("https://silxinc.com/_next/static/media/e4af272ccee01ff0-s.p.woff2") format("woff2");
}
@font-face {
    font-family: "Lora";
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url("https://silxinc.com/_next/static/media/5c0c2bcbaa4149ca-s.p.woff2") format("woff2");
}
:root {
    --accent: #F43E01;
    --accent-hover: #D63801;
    --accent-glow: rgba(244,62,1,0.16);
    --accent-soft: rgba(244,62,1,0.08);
    --bg: #F7F5F1;
    --surface: #FFFFFF;
    --surface-raised: #FBFAF7;
    --border: #E4E0D8;
    --border-hover: #CFC8BC;
    --ink: #171717;
    --ink-inv: #FFFFFF;
    --ink-secondary: #58534D;
    --ink-muted: #8A8379;
    --ink-faint: #C6BFB5;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow: 0 2px 8px rgba(0,0,0,0.06);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
    --font-display: "Inter", ui-sans-serif, system-ui, sans-serif;
    --font-body: "Inter", ui-sans-serif, system-ui, sans-serif;
    --font-serif: "Lora", Georgia, serif;
    --font-mono: "SFMono-Regular", "Cascadia Mono", "Menlo", monospace;
    --radius: 8px;
    --radius-sm: 8px;
    --radius-xs: 6px;
    --success: #16A34A;
    --success-soft: rgba(22,163,74,0.1);
    --danger: #DC2626;
    --danger-soft: rgba(220,38,38,0.1);
    --warning: #D97706;
    --warning-soft: rgba(217,119,6,0.1);
}

[data-theme="dark"] {
    --accent-glow: rgba(244,62,1,0.18);
    --accent-soft: rgba(244,62,1,0.10);
    --bg: #070707;
    --surface: #0E0E0F;
    --surface-raised: #151515;
    --border: #242424;
    --border-hover: #3A342F;
    --ink: #F4F1EC;
    --ink-inv: #080808;
    --ink-secondary: #B4ADA3;
    --ink-muted: #7E766C;
    --ink-faint: #403B35;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow: 0 2px 8px rgba(0,0,0,0.3);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
    --success-soft: rgba(52,211,153,0.12);
    --danger-soft: rgba(239,68,68,0.12);
    --warning-soft: rgba(251,191,36,0.12);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: auto; }

body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 var(--font-body);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
}

::selection { background: var(--accent); color: #fff; }

a { color: var(--accent); text-decoration: none; transition: color 0.15s; }
a:hover { color: var(--accent-hover); }

/* ── Noise overlay ── */
.noise {
    display: none;
}

/* ── Navigation ── */
.nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 34px;
    position: sticky;
    top: 0;
    z-index: 100;
}

.nav-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--ink);
}
.nav-brand:hover { color: var(--ink); }
.brand-mark {
    width: 28px;
    height: 28px;
    flex: 0 0 auto;
    color: var(--accent);
    display: block;
}
.brand-mark .brand-mark-q { fill: var(--ink-inv); }
.nav-brand span {
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 750;
    letter-spacing: 0;
}
.nav-brand span::first-letter {
    font-family: var(--font-serif);
    font-style: italic;
    color: var(--accent);
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 18px;
}
.nav-right a {
    color: var(--ink-muted);
    font-size: 12px;
    font-weight: 650;
    text-transform: uppercase;
    text-decoration: none;
}
.nav-right a:hover { color: var(--ink); }

.theme-btn {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    color: var(--ink-secondary);
    font: 500 12px var(--font-body);
    padding: 6px 14px;
    border-radius: var(--radius-xs);
    cursor: pointer;
    transition: all 0.15s;
}
.theme-btn:hover { border-color: var(--ink-muted); color: var(--ink); }

/* ── App layout ── */
.app {
    max-width: 1280px;
    margin: 0 auto;
    padding: 18px 28px 56px;
}

/* ── Market Ticker ── */
.ticker {
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 10px 0;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
    overflow-x: auto;
}
.ticker-item { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.ticker-label {
    color: var(--ink-muted);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0;
}
.ticker-val {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 13px;
}
.ticker-change {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 4px;
}
.ticker-up { color: var(--success); background: var(--success-soft); }
.ticker-down { color: var(--danger); background: var(--danger-soft); }

/* ── Tab Bar ── */
.tab-bar {
    display: flex;
    gap: 0;
    position: relative;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--border);
}
.tab-btn {
    background: none;
    border: none;
    color: var(--ink-muted);
    font: 700 12px var(--font-body);
    padding: 12px 18px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0;
    transition: color 0.2s;
    position: relative;
    white-space: nowrap;
}
.tab-btn:hover { color: var(--ink-secondary); }
.tab-btn.active { color: var(--accent); }
.tab-indicator {
    position: absolute;
    bottom: -1px;
    height: 2px;
    background: var(--accent);
    border-radius: 1px 1px 0 0;
    transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1), width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ── Views ── */
.view { display: none; }
.view.active { display: block; }
@keyframes viewIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ── Cards ── */
.card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    transition: border-color 0.2s;
}
.card:hover { border-color: var(--border-hover); }
.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}
.card-title {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 750;
    letter-spacing: 0;
}
.card-badge {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-muted);
    letter-spacing: 0;
    text-transform: uppercase;
}

/* ── API Status ── */
.api-status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0;
    color: var(--success);
    margin-bottom: 20px;
}
.api-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 6px var(--success);
}
@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

/* ── Stat Cards Grid ── */
.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 14px;
}
.stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 15px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
    cursor: default;
}
.stat-card::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 2px;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.15s ease;
}
.stat-card:hover { border-color: rgba(244,62,1,0.35); transform: translateY(-1px); }
.stat-card:hover::before { opacity: 1; }
.stat-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0;
    color: var(--ink-muted);
    margin-bottom: 6px;
}
.stat-value {
    font-family: var(--font-display);
    font-size: 25px;
    font-weight: 750;
    line-height: 1;
    letter-spacing: 0;
    position: relative;
    z-index: 1;
}
.stat-value.accent { color: var(--accent); }
.stat-value sub {
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-muted);
    letter-spacing: 0;
    vertical-align: baseline;
    margin-left: 2px;
}

/* ── Eval Progress ── */
.eval-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 16px;
    margin-bottom: 14px;
}
.eval-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}
.eval-title {
    font-weight: 600;
    font-size: 14px;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.eval-title a { color: var(--ink); }
.eval-title a:hover { color: var(--accent); }
.eval-meta {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-muted);
}
.progress-track {
    height: 8px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 10px;
}
.progress-fill {
    height: 100%;
    border-radius: 999px;
    background: var(--accent);
    transition: width 0.25s ease;
}
@keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}
.eval-idle .progress-fill { opacity: 0.2; animation: none; }
.eval-footer {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--ink-secondary);
}
.eval-footer span:last-child {
    font-family: var(--font-mono);
    color: var(--ink-muted);
}

/* ── Chart ── */
.pulse-grid {
    display: grid;
    grid-template-columns: minmax(0, 0.9fr) minmax(340px, 1.1fr);
    gap: 14px;
    margin-top: 14px;
}
.round-panel,
.signals-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
}
.round-panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
}
.round-panel-title {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 750;
    letter-spacing: 0;
}
.round-status {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
}
.round-kv {
    display: grid;
    grid-template-columns: 110px minmax(0, 1fr);
    gap: 8px 14px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
}
.round-kv:last-child { border-bottom: none; }
.round-kv span:first-child {
    color: var(--ink-muted);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
}
.round-kv span:last-child {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: var(--font-mono);
    color: var(--ink-secondary);
}

/* ── Leader View ── */
.leader-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr);
    gap: 14px;
    margin-bottom: 14px;
}
.leader-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    position: relative;
    overflow: hidden;
}
.leader-card.current::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent);
}
.leader-eyebrow {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0;
    color: var(--accent);
    margin-bottom: 12px;
}
.leader-eyebrow.secondary { color: var(--ink-muted); }
.leader-hotkey {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 750;
    line-height: 1.2;
    margin-bottom: 16px;
    word-break: break-all;
}
.leader-hotkey a { color: var(--ink); }
.leader-hotkey a:hover { color: var(--accent); }
.leader-detail {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
}
.leader-detail:last-child { border-bottom: none; }
.leader-detail-label {
    color: var(--ink-muted);
    font-weight: 500;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0;
}
.leader-detail-value {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 13px;
}
.leader-metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 16px;
}
.metric-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    padding: 11px;
    text-align: left;
}
.metric-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0;
    color: var(--ink-muted);
    margin-bottom: 4px;
}
.metric-value {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 700;
}
.metric-value.accent { color: var(--accent); }

/* ── Leader History ── */
.history-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
}
.history-title {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 750;
    margin-bottom: 14px;
}
.history-item {
    display: flex;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    align-items: flex-start;
}
.history-item:last-child { border-bottom: none; }
.history-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-top: 5px;
    flex-shrink: 0;
}
.history-dot.active { background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }
.history-dot.past { background: var(--border); }
.history-info { flex: 1; min-width: 0; }
.history-repo {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.history-repo a { color: var(--ink); }
.history-repo a:hover { color: var(--accent); }
.history-sub {
    font-size: 12px;
    color: var(--ink-muted);
}
.history-score {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-secondary);
    margin-top: 2px;
}

/* ── Filter Pills ── */
.filter-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
}
.filter-pill {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    color: var(--ink-secondary);
    font: 600 12px var(--font-body);
    padding: 6px 11px;
    border-radius: var(--radius-xs);
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
    letter-spacing: 0;
}
.filter-pill:hover { border-color: var(--ink-muted); color: var(--ink); }
.filter-pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
}
.filter-pill .count {
    font-family: var(--font-mono);
    font-size: 11px;
    margin-left: 4px;
    opacity: 0.8;
}

/* ── Tables ── */
.table-wrap {
    overflow-x: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
    max-height: 620px;
    overflow-y: auto;
}
.table-wrap::-webkit-scrollbar { width: 4px; height: 4px; }
.table-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    table-layout: fixed;
}
thead { position: sticky; top: 0; z-index: 2; }
th {
    text-align: left;
    padding: 11px 10px;
    font-weight: 750;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0;
    color: var(--ink-muted);
    border-bottom: 2px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    transition: color 0.15s;
    white-space: nowrap;
}
th:hover { color: var(--ink); }
th.sorted { color: var(--accent); }
th .sort-arrow { font-size: 10px; margin-left: 2px; }
td {
    padding: 10px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 12px;
}
td a { color: var(--ink); }
td a:hover { color: var(--accent); text-decoration: none; }
tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
tbody tr:hover { background: var(--accent-soft); }
tbody tr.eval-clickable { cursor: pointer; }
tbody tr.eval-clickable:focus {
    outline: 1px solid var(--accent);
    outline-offset: -1px;
    background: var(--accent-soft);
}
th:last-child, td:last-child { text-align: right; }
td.mono { font-family: var(--font-mono); font-size: 12px; }
.submetric { color: var(--ink-muted); margin-left: 6px; }
.gate-cell,
.weighted-cell {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
}
.gate-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 38px;
    padding: 2px 5px;
    border-radius: var(--radius-xs);
    font-size: 9px;
    font-weight: 800;
    text-transform: uppercase;
}
.gate-pass {
    background: var(--success-soft);
    color: var(--success);
}
.gate-fail {
    background: var(--danger-soft);
    color: var(--danger);
}
.gate-muted {
    background: rgba(156,163,175,0.1);
    color: var(--ink-muted);
}
.delta-good { color: var(--success); }
.delta-bad { color: var(--danger); }
.delta-flat { color: var(--ink-muted); }
.reason-hint {
    display: inline-flex;
    align-items: center;
    gap: 6px;
}
.reason-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
}

/* ── Status Badges ── */
.badge {
    display: inline-block;
    padding: 4px 9px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0;
    border-radius: var(--radius-xs);
}
.badge-scored { background: var(--success-soft); color: var(--success); }
.badge-dq { background: var(--danger-soft); color: var(--danger); }
.badge-king { background: var(--accent-soft); color: var(--accent); }
.badge-pending { background: rgba(156,163,175,0.1); color: var(--ink-muted); }
.badge-accepted { background: var(--success-soft); color: var(--success); }
.badge-gate { background: var(--danger-soft); color: var(--danger); }
.badge-rejected { background: var(--danger-soft); color: var(--danger); }
.badge-error { background: var(--warning-soft); color: var(--warning); }

/* ── Rounds ── */
.round-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    overflow: hidden;
    transition: border-color 0.15s, background 0.15s;
}
.round-item:hover { border-color: var(--border-hover); }
.round-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px 16px;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    transition: background 0.15s;
}
.round-header:hover { background: var(--accent-soft); }
.round-left { display: flex; align-items: center; gap: 16px; }
.round-time {
    font-weight: 600;
    font-size: 14px;

.round-block {

}
.round-right { display: flex; align-items: center; gap: 12px; }
.round-count {
    font-size: 12px;
    color: var(--ink-secondary);
}
.round-chevron {

}
.round-item.expanded .round-chevron { transform: rotate(180deg); }
.round-body {
    max-height: 0;
    overflow: hidden;

}
.round-item.expanded .round-body { max-height: 600px; }
.round-content {
    padding: 0 20px 16px;

}
.round-detail-row {

    justify-content: space-between;
    align-items: center;

    font-size: 12px;

}

    gap: 16px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-secondary);
}

    border-bottom: 1px solid var(--border);

    align-items: start;
}
.event-row:last-child { border-bottom: none; }
.event-time { color: var(--ink-muted); font-size: 12px; }
.event-type {

    width: fit-content;
    padding: 3px 7px;
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0;
    color: var(--ink-secondary);

.event-msg { color: var(--ink-secondary); font-size: 13px; line-height: 1.5; }
.event-row.event-eval .event-type { color: var(--accent); border-color: var(--accent-soft); background: var(--accent-soft); }
.event-row.event-dq .event-type { color: var(--danger); border-color: var(--danger-soft); background: var(--danger-soft); }
.event-row.event-chain .event-type { color: var(--success); border-color: var(--success-soft); background: var(--success-soft); }
.event-row.event-schedule .event-type { color: var(--warning); border-color: var(--warning-soft); background: var(--warning-soft); }

.drawer-backdrop {

    pointer-events: none;
    transition: opacity 0.16s ease;
    z-index: 190;
}
.drawer-backdrop.open { opacity: 1; pointer-events: auto; }
.detail-drawer {
    position: fixed;
    top: 0;
    right: 0;

    height: 100vh;
    background: var(--surface);
    border-left: 1px solid var(--border);
    box-shadow: var(--shadow-lg);

    z-index: 200;
    display: flex;
    flex-direction: column;

.detail-drawer.open { transform: translateX(0); }
.drawer-head {

.detail-grid {

}
.detail-label {
    color: var(--ink-muted);

    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 5px;
}
.detail-value {
    font-family: var(--font-mono);

    font-weight: 650;

}
.reason-box {
    border: 1px solid var(--danger-soft);

    border-radius: var(--radius-xs);
    padding: 13px;
    margin-top: 12px;

}
.reason-box strong {

    font-size: 11px;
    text-transform: uppercase;
    margin-bottom: 6px;
}
.reason-box.info-box {
    border-color: var(--border);

}
.reason-box.info-box strong { color: var(--accent); }
.drawer-repo {
    margin-bottom: 14px;

/* ── Load More ── */

    text-transform: uppercase;
    letter-spacing: 0;

.load-more-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── Empty state ── */
.empty {
    text-align: center;
    padding: 28px 18px;
    color: var(--ink-muted);
    font-size: 14px;
}

/* ── Footer ── */
.footer {

    padding: 22px 32px;

.footer-inner {
    max-width: 1280px;

.footer-brand {

}
.footer-links a:hover { color: var(--ink); text-decoration: none; }

/* ── Stagger animations ── */
@keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }

.stagger { animation: none; }

    .footer-inner { flex-direction: column; gap: 10px; }

}

/* ═══════════════════ UTILS ═══════════════════ */
function esc(s) { return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

    if (!iso) return "--";
    var t = typeof iso==="number" ? iso*1000 : new Date(iso).getTime();
    var s = Math.max(0, Math.floor((Date.now()-t)/1000));
    if (s<60) return s+"s ago";
    var m = Math.floor(s/60);

function numberOrNull(v) {

    if (explicit != null && Math.abs(explicit) > 0.0000001) return explicit;

}
function crownQualityPass(row) {
    if (typeof row.crown_quality_pass === "boolean") return row.crown_quality_pass;
    var q = numberOrNull(row.crown_quality);
    if (q == null) return null;
    var floor = numberOrNull(row.crown_quality_floor);
    var axes = numberOrNull(row.crown_quality_axes);
    var minAxes = numberOrNull(row.crown_quality_min_axes);
    if (floor == null) floor = 0.2;

function crownGateCell(row) {

function crownQualityTableCell(row) {

    if (q == null || row.status === "dq") return "--";
    var floor = numberOrNull(row.crown_quality_floor);
    var pass = crownQualityPass(row);

    return '<span class="'+cls+'">'+formatComposite(q)+'</span>'+(floor!=null?'<span class="submetric">/ '+formatComposite(floor)+'</span>':'');

function weightedCompositeCell(row) {
    if (row.composite_weighted == null && row.composite_worst == null) return "--";

function excludedAxes(row) {
    var axes = row.crown_quality_excluded_axes || (row.composite && row.composite.crown_quality_excluded_axes) || ["kl", "on_policy_rkl"];

function axisLabel(name) {

}
function compactAxes(comp, row) {
    var axes = comp && comp.axes ? comp.axes : null;
    if (!axes) return "";
    var excluded = {};
    var ex = excludedAxes(row || {});
    for (var i=0;i<ex.length;i++) excluded[ex[i]] = true;
    var names = ["capability","judge_probe","chat_turns_probe","length","ifeval_bench","math_bench","aime_bench","code_bench","mbpp_bench","reasoning_bench","reasoning_density","tool_use_bench","long_context_bench","robustness_bench","on_policy_rkl"];
    Object.keys(axes).sort().forEach(function(name){
        if (names.indexOf(name) === -1) names.push(name);

function currentEvalMetricText(ev) {

    if (ev && ev.loading) return ev.phase_label || ev.phase || "--";
    var mu = numberOrNull(ev && ev.mu_hat);
    return mu != null ? "μ̂: " + mu.toFixed(6) : "--";
}
function eventKind(e) {
    var raw = String(e.event_type || e.type || e.level || "status").toLowerCase();
    var msg = String(e.msg || e.message || "").toLowerCase();
    if (msg.indexOf("disqualified") >= 0 || msg.indexOf(" dq") >= 0) return "dq";
    if (msg.indexOf("weight") >= 0 || raw.indexOf("chain") >= 0) return "chain";
    if (msg.indexOf("waiting") >= 0 || msg.indexOf("round") >= 0 || raw.indexOf("schedule") >= 0) return "schedule";
    if (msg.indexOf("vllm") >= 0 || msg.indexOf("model") >= 0 || msg.indexOf("scoring") >= 0 || raw.indexOf("eval") >= 0) return "eval";
    return raw;
}
function eventLabel(kind) {
    if (kind === "dq") return "DQ";
    if (kind === "chain") return "CHAIN";
    if (kind === "schedule") return "ROUND";
    if (kind === "eval") return "EVAL";
    if (kind === "warning" || kind === "warn") return "WARN";
    return String(kind || "STATUS").toUpperCase();
}

/* ═══════════════════ RENDER: PULSE ═══════════════════ */
function renderPulse(d) {
    var king=d.king||{};
    var consensus=d.consensus_king||{};
    var hist=d.history||[];
    var q=d.queue||[];
    var ev=d.current_eval;
    var status=d.status||{};

    var scoredCount=0, dqCount=0;
    for(var i=0;i<hist.length;i++){
        if(hist[i].verdict==="error"||hist[i].error_code) dqCount++;
        else scoredCount++;
    }
    for(var i=0;i<q.length;i++){
        if(q[i].status==="disqualified") dqCount++;
        else if(q[i].status==="king"||q[i].status==="scored") scoredCount++;
    }

    var bestScore=null;
    for(var i=0;i<hist.length;i++){
        if(hist[i].accepted&&hist[i].avg_challenger_loss){
            bestScore=hist[i].avg_challenger_loss;
            break;
        }
    }

    var lastEval=hist.length?timeAgo(hist[0].timestamp):"--";
    var chainUid=king.uid!=null?king.uid:(status.chain_king_uid!=null?status.chain_king_uid:"--");
    var evalUid=status.state_king_uid!=null?status.state_king_uid:(d.state_king_uid!=null?d.state_king_uid:"--");
    var support=king.support_fraction!=null?king.support_fraction:consensus.support_fraction;
    var nextRound=status.blocks_remaining!=null?status.blocks_remaining+" blk":lastEval;

    var statsHtml='';
    var stats=[
        {label:"Chain Target", value:chainUid, accent:true},
        {label:"Eval Leader", value:evalUid},
        {label:"Support", value:pct(support)},
        {label:"Scored", value:scoredCount},
        {label:"DQ", value:dqCount},
        {label:"Next Round", value:nextRound, isSub:true}
    ];
    for(var i=0;i<stats.length;i++){
        var s=stats[i];
        var val=s.isSub ? String(s.value).replace(/(\d+)([a-z\s]+)/i,'$1<sub>$2</sub>') : esc(String(s.value));
        statsHtml+='<div class="stat-card stagger"><div class="stat-label">'+esc(s.label)+'</div><div class="stat-value'+(s.accent?' accent':'')+'">'+val+'</div></div>';
    }
    document.getElementById("stats-grid").innerHTML=statsHtml;

    var ec=document.getElementById("eval-card");
    var titleEl=document.getElementById("eval-title");
    var metaEl=document.getElementById("eval-meta");
    var barEl=document.getElementById("eval-bar");
    var statusEl=document.getElementById("eval-status");
    var detailEl=document.getElementById("eval-detail");

    if(ev){
        ec.classList.remove("eval-idle");
        var progressPct=ev.progress_percent!=null?Math.round(Number(ev.progress_percent)):(ev.total>0?Math.round(ev.progress/ev.total*100):0);
        progressPct=Math.max(0,Math.min(100,progressPct||0));
        titleEl.innerHTML=ev.challenger_repo?repoLink(ev.challenger_repo):esc(ev.hotkey?short(ev.hotkey,12):"Evaluating");
        metaEl.textContent="UID "+ev.uid;
        barEl.style.width=(ev.total>0||ev.progress_percent!=null)?progressPct+"%":(ev.loading?"12%":"0%");
        statusEl.textContent=ev.status_text||(ev.loading?(ev.phase_label||"Loading model")+" …":ev.progress+" / "+ev.total+"  ("+progressPct+"%)");
        detailEl.textContent=currentEvalMetricText(ev);
    } else {
        ec.classList.add("eval-idle");
        titleEl.textContent=status.label||"Idle";
        metaEl.textContent="";
        barEl.style.width="0%";
        var detail=status.detail||"No evaluation running.";
        if(status.next_round_start_block) detail+=" Next round #"+status.next_round_start_block+".";
        if(status.blocks_remaining!=null) detail+=" "+status.blocks_remaining+" blocks left.";
        statusEl.textContent=detail;
        var modeText=status.weight_reveal_pending?"PENDING REVEAL: UID "+(status.state_king_uid||"--"):(status.mode||"--");
        if(status.chain_king_uid!=null&&status.state_king_uid!=null&&status.chain_king_uid!==status.state_king_uid) {
            modeText+=" | eval leader UID "+status.state_king_uid;
        }
        detailEl.textContent=modeText;
    }

    renderPulsePanels(d);
}

function renderPulsePanels(d) {
    var status=d.status||{};
    var ev=d.current_eval;
    var q=d.queue||[];
    var events=d.events||[];
    var valid=q.filter(function(x){return x.status!=="disqualified";}).length;
    var dq=q.filter(function(x){return x.status==="disqualified";}).length;
    var scheduled=q.filter(function(x){return x.status==="scheduled";}).length;
    var phase=ev?(ev.phase_label||ev.phase||"evaluating"):(status.stage||status.mode||"waiting");
    var panel='';
    panel+='<div class="round-panel-header"><span class="round-panel-title">Current Round</span><span class="round-status">'+esc(phase)+'</span></div>';
    panel+='<div class="round-kv"><span>State</span><span>'+esc(status.label||status.detail||"--")+'</span></div>';

    if(status.next_round_start_block!=null) panel+='<div class="round-kv"><span>Next</span><span>#'+esc(status.next_round_start_block)+(status.blocks_remaining!=null?' · '+esc(status.blocks_remaining)+' blocks':'')+'</span></div>';

/* ═══════════════════ RENDER: EVALUATIONS ═══════════════════ */
function buildEvalRows(d) {
    var hist=d.history||[];
    var q=d.queue||[];
    var rows=[];
    var seen={};
    var currentByUid={};

    for(var qi=0;qi<q.length;qi++){
        if(q[qi].uid!=null) currentByUid[q[qi].uid]=q[qi];
    }

    for(var i=0;i<hist.length;i++){
        var h=hist[i];
        var current=h.uid!=null?currentByUid[h.uid]:null;
        if(current&&current.hf_repo&&current.hf_repo!==h.challenger_repo) continue;
        var isDq=h.verdict==="error"||!!h.error_code;
        var isAccepted=!!h.accepted;
        var st=isDq?"dq":(isAccepted?"accepted":"scored");
        var score = numberOrNull(h.avg_challenger_loss);
        if (score != null && score <= 0) score = null;
        var delta = rowDelta(h);
        var comp = h.composite || {};
        rows.push({
            uid:h.uid,
            hotkey:h.hotkey,
            repo:h.challenger_repo,
            score:score,
            composite:comp,
            composite_weighted:numberOrNull(h.composite_weighted != null ? h.composite_weighted : comp.weighted),
            composite_worst:numberOrNull(h.composite_worst != null ? h.composite_worst : comp.worst),
            composite_present_count:numberOrNull(h.composite_present_count != null ? h.composite_present_count : comp.present_count),
            composite_version:h.composite_version != null ? h.composite_version : comp.version,
            crown_quality:numberOrNull(h.crown_quality != null ? h.crown_quality : comp.crown_quality),
            crown_quality_axes:numberOrNull(h.crown_quality_axes != null ? h.crown_quality_axes : comp.crown_quality_axes),
            crown_quality_floor:numberOrNull(h.crown_quality_floor != null ? h.crown_quality_floor : comp.crown_quality_floor),
            crown_quality_min_axes:numberOrNull(h.crown_quality_min_axes != null ? h.crown_quality_min_axes : comp.crown_quality_min_axes),
            crown_quality_pass:h.crown_quality_pass != null ? !!h.crown_quality_pass : (comp.crown_quality_pass != null ? !!comp.crown_quality_pass : null),
            crown_quality_excluded_axes:h.crown_quality_excluded_axes || comp.crown_quality_excluded_axes || ["kl","on_policy_rkl"],
            delta:delta,
            mu_hat:numberOrNull(h.mu_hat),
            lcb:numberOrNull(h.lcb),
            p_value:numberOrNull(h.p_value),
            king_loss:numberOrNull(h.avg_king_loss),
            challenger_loss:score,
            time:numberOrNull(h.wall_time_s),
            status:st,
            verdict:h.verdict_label||h.verdict||st,
            ts:h.timestamp,
            reason:h.error_detail||h.error_code||h.selection_detail||"",
            selection:h.selection_detail||"",
            gate:h.selection_gate||"",
            source:"history"
        });
        if(h.uid!=null) seen[h.uid]=true;
    }

    for(var i=0;i<q.length;i++){
        var e=q[i];
        if(e.uid!=null&&seen[e.uid]) continue;
        var qst=e.status||"pending";
        if(qst==="disqualified") qst="dq";
        else if(qst==="king") qst="accepted";
        else if(["scored","evaluated","scheduled","valid"].indexOf(qst)===-1) qst="pending";
        var qScore = numberOrNull(e.score);
        if(qst==="valid" && qScore != null) qst="scored";
        var qComp = e.composite || {};
        rows.push({
            uid:e.uid,
            hotkey:e.hotkey,
            repo:e.hf_repo,
            score:qScore,
            composite:qComp,
            composite_weighted:numberOrNull(e.composite_weighted != null ? e.composite_weighted : qComp.weighted),
            composite_worst:numberOrNull(e.composite_worst != null ? e.composite_worst : qComp.worst),
            composite_present_count:numberOrNull(e.composite_present_count != null ? e.composite_present_count : qComp.present_count),
            composite_version:e.composite_version != null ? e.composite_version : qComp.version,
            crown_quality:numberOrNull(e.crown_quality != null ? e.crown_quality : qComp.crown_quality),
            crown_quality_axes:numberOrNull(e.crown_quality_axes != null ? e.crown_quality_axes : qComp.crown_quality_axes),
            crown_quality_floor:numberOrNull(e.crown_quality_floor != null ? e.crown_quality_floor : qComp.crown_quality_floor),
            crown_quality_min_axes:numberOrNull(e.crown_quality_min_axes != null ? e.crown_quality_min_axes : qComp.crown_quality_min_axes),
            crown_quality_pass:e.crown_quality_pass != null ? !!e.crown_quality_pass : (qComp.crown_quality_pass != null ? !!qComp.crown_quality_pass : null),
            crown_quality_excluded_axes:e.crown_quality_excluded_axes || qComp.crown_quality_excluded_axes || ["kl","on_policy_rkl"],
            delta:null,
            mu_hat:null,
            lcb:null,
            p_value:null,
            king_loss:null,
            challenger_loss:null,
            time:null,
            status:qst,
            verdict:e.status_label||qst,
            ts:null,
            reason:e.status_detail||e.reason||"",
            selection:"",
            gate:"",
            block:e.block,
            source:"queue"
        });
    }

    return rows;
}

function isScoredEvalRow(r) {
    return ["accepted", "scored"].indexOf(r.status) >= 0 && r.score != null;
}

function isPendingEvalRow(r) {
    return ["valid", "scheduled", "pending", "evaluated"].indexOf(r.status) >= 0 && r.score == null;
}

function renderEvaluations(d) {
    var rows=buildEvalRows(d);
    var allCount=rows.length;
    var scoredCount=rows.filter(isScoredEvalRow).length;
    var pendingCount=rows.filter(isPendingEvalRow).length;
    var dqCount=rows.filter(function(r){return r.status==="dq";}).length;

    var filtersHtml='';
    filtersHtml+='<button class="filter-pill'+(_evalFilter==="all"?" active":"")+'" data-filter="all">All <span class="count">'+allCount+'</span></button>';
    filtersHtml+='<button class="filter-pill'+(_evalFilter==="scored"?" active":"")+'" data-filter="scored">Scored <span class="count">'+scoredCount+'</span></button>';
    filtersHtml+='<button class="filter-pill'+(_evalFilter==="pending"?" active":"")+'" data-filter="pending">Pending <span class="count">'+pendingCount+'</span></button>';
    filtersHtml+='<button class="filter-pill'+(_evalFilter==="dq"?" active":"")+'" data-filter="dq">Disqualified <span class="count">'+dqCount+'</span></button>';
    document.getElementById("eval-filters").innerHTML=filtersHtml;

    document.querySelectorAll("#eval-filters .filter-pill").forEach(function(p){
        p.addEventListener("click",function(){
            _evalFilter=p.dataset.filter;
            if(_data) renderEvaluations(_data);
        });
    });

    var filtered=rows;
    if(_evalFilter==="scored") filtered=rows.filter(isScoredEvalRow);
    if(_evalFilter==="pending") filtered=rows.filter(isPendingEvalRow);
    if(_evalFilter==="dq") filtered=rows.filter(function(r){return r.status==="dq";});

    filtered.sort(function(a,b){
        var va,vb;
        if(_evalSort.col==="score"){va=a.score;vb=b.score;}
        else if(_evalSort.col==="crown_quality"){va=a.crown_quality;vb=b.crown_quality;}
        else if(_evalSort.col==="weighted"){va=a.composite_weighted;vb=b.composite_weighted;}
        else if(_evalSort.col==="delta"){va=a.delta;vb=b.delta;}
        else if(_evalSort.col==="uid"){va=a.uid||0;vb=b.uid||0;}
        else {va=a.score;vb=b.score;}
        va = va == null ? (_evalSort.dir==="desc" ? -Infinity : Infinity) : Number(va);
        vb = vb == null ? (_evalSort.dir==="desc" ? -Infinity : Infinity) : Number(vb);
        return _evalSort.dir==="desc"?vb-va:va-vb;
    });
    _visibleEvalRows=filtered;

    var cols=[
        {key:"uid",label:"UID",w:"60px"},
        {key:"hotkey",label:"Hotkey",w:"140px"},
        {key:"repo",label:"Repo",w:"1fr"},
        {key:"score",label:"KL",w:"100px",sort:true},
        {key:"crown_quality",label:"Crown Quality",w:"125px",sort:true},
        {key:"time",label:"Time",w:"80px"},
        {key:"status",label:"Status",w:"100px"}
    ];

    var thHtml='<tr>';
    for(var i=0;i<cols.length;i++){
        var c=cols[i];
        var isSorted=c.sort&&_evalSort.col===c.key;
        var arrow=isSorted?(_evalSort.dir==="desc"?" ↓":" ↑"):"";
        thHtml+='<th'+(c.sort?' class="'+(isSorted?"sorted":"")+'" data-sort="'+c.key+'"':'')+' style="width:'+c.w+'">'+c.label+(arrow?'<span class="sort-arrow">'+arrow+'</span>':'')+'</th>';
    }
    thHtml+='</tr>';
    document.getElementById("eval-thead").innerHTML=thHtml;

    document.querySelectorAll("#eval-thead th[data-sort]").forEach(function(th){
        th.addEventListener("click",function(){
            var col=th.dataset.sort;
            if(_evalSort.col===col) _evalSort.dir=_evalSort.dir==="desc"?"asc":"desc";
            else { _evalSort.col=col; _evalSort.dir=col==="score"?"asc":"desc"; }
            if(_data) renderEvaluations(_data);
        });
    });

    if(!filtered.length){
        document.getElementById("eval-tbody").innerHTML='<tr><td colspan="7" class="empty">No evaluations found</td></tr>';
        return;
    }

    var tbHtml='';
    for(var i=0;i<filtered.length;i++){
        var r=filtered[i];
        var gateFail=isGateFail(r);
        var badgeClass=r.status==="dq"?"badge-dq":(r.status==="accepted"?"badge-accepted":(gateFail?"badge-gate":(["scored","evaluated"].indexOf(r.status)>=0?"badge-scored":"badge-pending")));
        var rowVerdict=r.verdict&&String(r.verdict).toLowerCase()!=="ok"?r.verdict:"";
        var badgeLabel=gateFail?"GATE FAIL":(r.status==="dq"?"DQ":r.status==="accepted"?"CROWNED":(rowVerdict||(r.status==="scored"?"SCORED":r.status==="evaluated"?"WAITING":r.status==="scheduled"?"SCHEDULED":r.status==="valid"?"VALID":"PENDING")));
        var scoreColor=r.score!=null&&r.status!=="dq"?' style="color:var(--accent)"':'';
        var delta=r.delta;
        tbHtml+='<tr class="stagger eval-clickable" tabindex="0" data-eval-idx="'+i+'" title="Open details">';
        tbHtml+='<td class="mono"><b>'+esc(r.uid!=null?r.uid:"--")+'</b></td>';
        tbHtml+='<td class="mono">'+hkLink(r.hotkey)+'</td>';
        tbHtml+='<td>'+repoLink(r.repo)+'</td>';
        tbHtml+='<td class="mono"'+scoreColor+'>'+(r.score!=null?Number(r.score).toFixed(4):"--")+'</td>';
        tbHtml+='<td class="mono">'+crownQualityTableCell(r)+'</td>';
        tbHtml+='<td class="mono">'+(r.time!=null?Math.round(r.time)+"s":"--")+'</td>';
        tbHtml+='<td><span class="badge '+badgeClass+'"><span class="reason-hint"><span class="reason-dot"></span>'+badgeLabel+'</span></span></td>';
        tbHtml+='</tr>';
    }
    document.getElementById("eval-tbody").innerHTML=tbHtml;
    document.querySelectorAll("#eval-tbody tr[data-eval-idx]").forEach(function(tr){
        function openFromRow(evt){
            if(evt && evt.target && evt.target.closest && evt.target.closest("a")) return;
            var row=_visibleEvalRows[Number(tr.dataset.evalIdx)];
            if(row) openEvalDrawer(row);
        }
        tr.addEventListener("click",openFromRow);
        tr.addEventListener("keydown",function(evt){
            if(evt.key==="Enter" || evt.key===" "){ evt.preventDefault(); openFromRow(evt); }
        });
    });
}

function detailCell(label, value, cls) {
    return '<div class="detail-cell"><div class="detail-label">'+esc(label)+'</div><div class="detail-value '+(cls||'')+'">'+value+'</div></div>';
}
function openEvalDrawer(row) {
    var drawer=document.getElementById("detail-drawer");
    var backdrop=document.getElementById("drawer-backdrop");
    var title=document.getElementById("drawer-title");
    var subtitle=document.getElementById("drawer-subtitle");
    var body=document.getElementById("drawer-body");
    var status=row.status==="dq"?"Disqualified":row.status==="accepted"?"Current / crowned":(isGateFail(row)?"Crown gate failed":"Evaluation");
    title.textContent=status+" · UID "+(row.uid!=null?row.uid:"--");
    subtitle.textContent=isGateFail(row)?"GATE FAIL":(row.status==="accepted"?"CROWNED":(row.verdict||row.status||"--"));
    var delta=row.delta;
    var exAxes=excludedAxes(row);
    var html='';
    html+='<div class="drawer-repo">'+repoLink(row.repo)+'</div>';
    html+='<div class="detail-grid">';
    html+=detailCell("Crown Quality", crownGateCell(row));
    html+=detailCell("Crown Axes", (row.crown_quality_axes!=null?esc(row.crown_quality_axes):"--")+(row.crown_quality_min_axes!=null?'<span class="submetric">min '+esc(row.crown_quality_min_axes)+'</span>':""));
    html+=detailCell("KL", formatLoss(row.score));
    html+=detailCell("Weighted Composite", weightedCompositeCell(row));
    html+=detailCell("Worst Axis", formatComposite(row.composite_worst));
    html+=detailCell("Weighted Axes", row.composite_present_count!=null?esc(row.composite_present_count):"--");
    html+=detailCell("Delta", '<span class="'+deltaClass(delta)+'">'+formatSigned(delta,4)+'</span>');
    html+=detailCell("King KL", formatLoss(row.king_loss));
    html+=detailCell("Model KL", formatLoss(row.challenger_loss));
    html+=detailCell("LCB", row.lcb!=null&&Math.abs(row.lcb)>0.0000001?formatSigned(row.lcb,4):"--");
    html+=detailCell("p-value", row.p_value!=null?Number(row.p_value).toPrecision(4):"--");
    html+=detailCell("Eval time", row.time!=null?Math.round(row.time)+"s":"--");
    html+=detailCell("Block", row.block!=null?"#"+esc(row.block):"--");
    html+='</div>';
    html+='<div class="detail-grid">';
    html+=detailCell("Hotkey", hkLink(row.hotkey));
    html+=detailCell("When", row.ts?timeAgo(row.ts):"--");
    html+='</div>';
    if(row.reason){
        html+='<div class="reason-box"><strong>'+(row.status==="dq"?"DQ reason":"Validator note")+'</strong>'+esc(row.reason)+'</div>';
    } else if(row.status==="dq") {
        html+='<div class="reason-box"><strong>DQ reason</strong>No reason came through in this dashboard payload.</div>';
    }
    if(row.selection || row.gate){
        html+='<div class="reason-box"><strong>Decision detail</strong>'+esc(row.selection || row.gate)+'</div>';
    }
    html+='<div class="reason-box info-box"><strong>Score rule</strong>Crown Quality must clear '+esc(formatComposite(row.crown_quality_floor!=null?row.crown_quality_floor:0.2))+' on non-relative quality axes. Weighted Composite is telemetry and still includes '+esc(exAxes.join(", ") || "kl, on_policy_rkl")+'.</div>';
    var axesText = compactAxes(row.composite, row);
    if(axesText){
        html+='<div class="reason-box info-box"><strong>Axis scores</strong>'+esc(axesText)+'</div>';
    }
    body.innerHTML=html;
    drawer.classList.add("open");
    backdrop.classList.add("open");
    drawer.setAttribute("aria-hidden","false");
}
function closeEvalDrawer() {
    document.getElementById("detail-drawer").classList.remove("open");
    document.getElementById("drawer-backdrop").classList.remove("open");
    document.getElementById("detail-drawer").setAttribute("aria-hidden","true");
}
document.getElementById("drawer-close").addEventListener("click", closeEvalDrawer);
document.getElementById("drawer-backdrop").addEventListener("click", closeEvalDrawer);
document.addEventListener("keydown", function(evt){ if(evt.key==="Escape") closeEvalDrawer(); });

/* ═══════════════════ RENDER: ROUNDS ═══════════════════ */
function renderRounds(d) {
    var hist=d.history||[];
    if(!hist.length){
        document.getElementById("rounds-list").innerHTML='<div class="empty">No evaluation rounds yet</div>';
        return;
    }

    var shown=hist.slice(0,_roundsShown);
    var remaining=hist.length-_roundsShown;

    var html='';
    for(var i=0;i<shown.length;i++){
        var h=shown[i];
        var isExp=!!_expanded[i];
        var isDq=h.verdict==="error"||!!h.error_code;
        var badgeClass=isDq?"badge-dq":h.accepted?"badge-accepted":"badge-scored";
        var badgeLabel=isDq?"ERROR":h.accepted?"ACCEPTED":"SCORED";

        html+='<div class="round-item stagger'+(isExp?" expanded":"")+'" data-idx="'+i+'">';
        html+='<div class="round-header" data-idx="'+i+'">';
        html+='<div class="round-left">';
        html+='<span class="round-time">'+timeAgo(h.timestamp)+'</span>';
        html+='<span class="round-block">UID '+esc(h.uid)+'</span>';
        html+='</div>';
        html+='<div class="round-right">';
        html+='<span class="badge '+badgeClass+'">'+badgeLabel+'</span>';
        html+='<span class="round-count">'+esc(h.challenger_repo?short(h.challenger_repo,24):"--")+'</span>';
        html+='<span class="round-chevron">▾</span>';
        html+='</div></div>';

        html+='<div class="round-body"><div class="round-content">';
        html+='<div class="round-detail-row"><span class="leader-detail-label">Repo</span><span class="round-detail-repo">'+repoLink(h.challenger_repo)+'</span></div>';
        html+='<div class="round-detail-row"><span class="leader-detail-label">Hotkey</span><span class="round-detail-repo">'+hkLink(h.hotkey)+'</span></div>';
        html+='<div class="round-detail-row"><span class="leader-detail-label">King KL</span><span class="mono">'+formatLoss(h.avg_king_loss)+'</span></div>';
        html+='<div class="round-detail-row"><span class="leader-detail-label">Model KL</span><span class="mono">'+formatLoss(h.avg_challenger_loss)+'</span></div>';
        var rd=rowDelta(h);
        html+='<div class="round-detail-row"><span class="leader-detail-label">Δ vs King</span><span class="mono '+deltaClass(rd)+'">'+formatSigned(rd,4)+'</span></div>';
        html+='<div class="round-detail-row"><span class="leader-detail-label">Eval Time</span><span class="mono">'+(h.wall_time_s?Math.round(h.wall_time_s)+"s":"--")+'</span></div>';
        if(isDq&&h.error_detail) html+='<div class="round-detail-row"><span class="leader-detail-label">Error</span><span style="color:var(--danger);font-size:12px;">'+esc(h.error_detail)+'</span></div>';
        html+='</div></div></div>';
    }

    if(remaining>0){
        html+='<div class="load-more"><button class="load-more-btn" id="load-more-rounds">Load More ('+remaining+' remaining)</button></div>';
    }

    document.getElementById("rounds-list").innerHTML=html;

    document.querySelectorAll(".round-header").forEach(function(rh){
        rh.addEventListener("click",function(){
            var idx=parseInt(rh.dataset.idx);
            _expanded[idx]=!_expanded[idx];
            var item=rh.parentElement;
            item.classList.toggle("expanded",!!_expanded[idx]);
        });
    });

    var lmBtn=document.getElementById("load-more-rounds");
    if(lmBtn){
        lmBtn.addEventListener("click",function(){
            _roundsShown+=10;
            if(_data) renderRounds(_data);
        });
    }
}

/* ═══════════════════ RENDER: EVENTS ═══════════════════ */
function renderEventsTab(d) {
    var events=d.events||[];
    renderEventsList("events-list", events, 60, false);
}

function renderEventsList(containerId, events, limit, compact) {
    var el=document.getElementById(containerId);
    if(!events.length){
        el.innerHTML='<div class="empty">No validator events yet</div>';
        return;
    }

    var html='';
    var shown=events.slice(0,limit||50);
    for(var i=0;i<shown.length;i++){
        var e=shown[i];
        var kind=eventKind(e);
        var msg=e.msg||e.message||"";
        if(compact && i>0 && msg===(shown[i-1].msg||shown[i-1].message)) continue;
        html+='<div class="event-row event-'+esc(kind)+' stagger">';
        html+='<span class="event-time" title="'+esc(e.ts||"")+'">'+timeAgo(e.ts)+'</span>';
        html+='<span class="event-type">'+esc(eventLabel(kind))+'</span>';
        html+='<span class="event-msg">'+esc(msg)+'</span>';
        html+='</div>';
    }
    el.innerHTML=html || '<div class="empty">No validator events yet</div>';
}

/* ═══════════════════ MAIN RENDER ═══════════════════ */
function renderAll(d) {
    renderTicker(d);
    switch(_tab){
        case "pulse": renderPulse(d); break;
        case "leader": renderLeader(d); break;
        case "evaluations": renderEvaluations(d); break;
        case "rounds": renderRounds(d); break;
        case "events": renderEventsTab(d); break;
    }
}

/* ═══════════════════ POLLING ═══════════════════ */
async function poll(){
    if(_isPolling) return;
    _isPolling=true;
    for(var i=0;i<URLS.length;i++){
        try{
            var r=await fetch(URLS[i]+"?t="+Date.now());
            if(r.ok){
                var text=await r.text();
                var staleClock=Date.now()-_lastRenderAt>30000;
                if(text===_payloadSig&&_data&&!staleClock) {
                    _isPolling=false;
                    return;
                }
                var nextData=JSON.parse(text);
                _payloadSig=text;
                _data=nextData;
                _lastRenderAt=Date.now();
                renderAll(_data);
                _isPolling=false;
                return;
            }
        }catch(e){}
    }
    _isPolling=false;
}

poll();
setInterval(poll,POLL);
</script>
